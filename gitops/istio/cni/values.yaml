# Source of truth: Istio CNI Plugin for Ambient Mode on GKE
profile: ambient

cni:
  ambient:
    enabled: true
    dnsCapture: true
    ipv6: true
    reconcileIptablesOnStartup: true
  # GKE node filesystem paths for CNI binaries and network configuration
  cniBinDir: /home/kubernetes/bin
  cniConfDir: /etc/cni/net.d
  cniNetnsDir: /var/run/netns

  excludeNamespaces:
    - kube-system
    - istio-system
    - gmp-system
    - gke-managed-cim
