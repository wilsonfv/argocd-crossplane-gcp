# Source of truth: Istio Discovery (istiod) Control Plane for Ambient Mode
profile: ambient

pilot:
  env:
    PILOT_ENABLE_AMBIENT: "true"
  autoscaleEnabled: true
  autoscaleMin: 1
  autoscaleMax: 5
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

global:
  istioNamespace: istio-system
  logging:
    level: "default:info"
