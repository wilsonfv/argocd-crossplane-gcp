apiVersion: v1
kind: Namespace
metadata:
  name: apps-ambient
  labels:
    # Ambient mode enabled at namespace level: no sidecars injected!
    istio.io/dataplane-mode: ambient
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: apps-ambient
  labels:
    app: echo-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.43
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: apps-ambient
spec:
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: echo-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleep-client
  namespace: apps-ambient
  labels:
    app: sleep-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sleep-client
  template:
    metadata:
      labels:
        app: sleep-client
    spec:
      containers:
        - name: sleep
          image: curlimages/curl:8.6.0
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
