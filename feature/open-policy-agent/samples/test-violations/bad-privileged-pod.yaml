# Demonstrates policy violation: Blocked by K8sBlockPrivileged constraint
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod-violation
  namespace: apps-opa
  labels:
    app: test-app
spec:
  containers:
    - name: privileged-container
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
