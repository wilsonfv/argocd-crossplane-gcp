# Argo CD Repository Credentials Secret Template
# Allows Argo CD to pull configurations from the GitHub repositories.
#
# Apply using:
#   kubectl apply -f argocd/repo-secret.template.yaml
apiVersion: v1
kind: Secret
metadata:
  name: repo-argocd-crossplane-gcp
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/wilsonfv/argocd-crossplane-gcp.git
  username: oauth2
  password: ${GITHUB_PAT_TOKEN}
