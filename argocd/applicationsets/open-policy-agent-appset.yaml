apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: open-policy-agent-stack
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: cluster-name
                    operator: NotIn
                    values:
                      - argocd-control-plane
                      - argocd-control-plane-headless
                      - in-cluster
          - list:
              elements:
                - app: opa-gatekeeper
                  path: feature/open-policy-agent/charts/gatekeeper
                  wave: "0"
                - app: opa-policies
                  path: feature/open-policy-agent/policies
                  wave: "1"
                - app: opa-samples
                  path: feature/open-policy-agent/samples
                  wave: "2"
  template:
    metadata:
      name: "{{app}}-{{name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/wilsonfv/argocd-crossplane-gcp.git
        targetRevision: HEAD
        path: "{{path}}"
      destination:
        name: "{{name}}"
        namespace: gatekeeper-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: gatekeeper-validating-webhook-configuration
          jsonPointers:
            - /webhooks
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: gatekeeper-mutating-webhook-configuration
          jsonPointers:
            - /webhooks
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
