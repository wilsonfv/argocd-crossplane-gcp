apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: open-policy-agent-stack
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - scmProvider:
                    cloneProtocol: https
                    github:
                      api: http://github-scm-proxy.argocd.svc.cluster.local
                      organization: wilsonfv
                      tokenRef:
                        secretName: scm-github-token
                        key: token
                    filters:
                      - repositoryMatch: "^argocd-mq-usecase-.*"
                - git:
                    repoURL: "{{url}}"
                    revision: "{{branch}}"
                    files:
                      - path: "*/versions.yaml"
          - list:
              elements:
                - app: opa-gatekeeper
                  appPath: "open-policy-agent/versions/{{versions.gatekeeper}}/charts/gatekeeper"
                  wave: "0"
                - app: opa-policies
                  appPath: open-policy-agent/policies
                  wave: "1"
                - app: opa-samples
                  appPath: open-policy-agent/samples
                  wave: "2"
  template:
    metadata:
      name: "{{app}}-{{path.basename}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/wilsonfv/argocd-applications.git
        targetRevision: HEAD
        path: "{{appPath}}"
      destination:
        name: "{{path.basename}}"
        namespace: gatekeeper-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - SkipDryRunOnMissingResource=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: gatekeeper-validating-webhook-configuration
          jsonPointers:
            - /webhooks
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: gatekeeper-mutating-webhook-configuration
          jsonPointers:
            - /webhooks
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
