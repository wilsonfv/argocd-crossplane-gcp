apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-ambient-stack
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - scmProvider:
                    cloneProtocol: https
                    github:
                      api: http://github-scm-proxy.argocd.svc.cluster.local
                      organization: wilsonfv
                      tokenRef:
                        secretName: scm-github-token
                        key: token
                    filters:
                      - repositoryMatch: "^argocd-mq-usecase-.*"
                - git:
                    repoURL: "{{url}}"
                    revision: "{{branch}}"
                    files:
                      - path: "*/versions.yaml"
                      - path: "gke-managed-cluster-3/versions.yaml"
                        exclude: true
                      - path: "gke-managed-cluster-4/versions.yaml"
                        exclude: true
                      - path: "argocd-control-plane-headless/versions.yaml"
                        exclude: true
          - list:
              elements:
                - app: istio-base
                  wave: "0"
                - app: istio-cni
                  wave: "1"
                - app: istiod
                  wave: "1"
                - app: istio-ztunnel
                  wave: "2"
  template:
    metadata:
      name: "{{app}}-{{path.basename}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/wilsonfv/argocd-applications.git
        targetRevision: HEAD
        path: "istio/versions/{{versions.istio}}/charts/{{app}}"
      destination:
        name: "{{path.basename}}"
        namespace: istio-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
          jsonPointers:
            - /webhooks
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istio-validator-istio-system
          jsonPointers:
            - /webhooks
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
