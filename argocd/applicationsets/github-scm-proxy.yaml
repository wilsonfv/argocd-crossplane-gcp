apiVersion: v1
kind: ConfigMap
metadata:
  name: github-scm-proxy-conf
  namespace: argocd
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;
        location /api/v3/orgs/wilsonfv/repos {
          proxy_pass https://api.github.com/users/wilsonfv/repos;
          proxy_set_header Host api.github.com;
          proxy_ssl_server_name on;
        }
        location /orgs/wilsonfv/repos {
          proxy_pass https://api.github.com/users/wilsonfv/repos;
          proxy_set_header Host api.github.com;
          proxy_ssl_server_name on;
        }
        location /api/v3/ {
          proxy_pass https://api.github.com/;
          proxy_set_header Host api.github.com;
          proxy_ssl_server_name on;
        }
        location / {
          proxy_pass https://api.github.com/;
          proxy_set_header Host api.github.com;
          proxy_ssl_server_name on;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-scm-proxy
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-scm-proxy
  template:
    metadata:
      labels:
        app: github-scm-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: conf
          configMap:
            name: github-scm-proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: github-scm-proxy
  namespace: argocd
spec:
  selector:
    app: github-scm-proxy
  ports:
    - port: 80
      targetPort: 8080
