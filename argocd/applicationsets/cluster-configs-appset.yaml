apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-configs-mq-usecase-1
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            gcp-project: mq-usecase-1
  template:
    metadata:
      name: "cluster-config-{{name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/wilsonfv/argocd-mq-usecase-1.git
        targetRevision: HEAD
        path: "{{name}}"
      destination:
        name: "{{name}}"
        namespace: istio-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
