apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-ambient-manifests
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - list:
              elements:
                - app: istio-policies
                  appPath: istio/policies
                  wave: "3"
                - app: ambient-samples
                  appPath: istio/samples
                  wave: "4"
  template:
    metadata:
      name: "{{app}}-{{name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/wilsonfv/argocd-applications.git
        targetRevision: HEAD
        path: "{{appPath}}"
      destination:
        name: "{{name}}"
        namespace: istio-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
